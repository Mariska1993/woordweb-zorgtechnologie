<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woordweb Zorgtechnologie</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #d8c090;
    font-family: Arial, sans-serif;
    padding: 20px;
}

#canvas {
    width: 100%;
    max-width: 1000px;
    padding: 20px;
    background-color: #d8c090;
}

#woordweb {
    position: relative;
    width: 100%;
    aspect-ratio: 10 / 7;
    background-color: white;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
    overflow: hidden;
}

svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

line {
    stroke: black;
    stroke-width: 2;
}

.midden {
    position: absolute;
    top: 43.57%;
    left: 32.5%;
    width: 35%;
    height: 12.86%;
    border: 3px solid black;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(14px, 4.2vw, 42px);
    font-weight: bold;
    text-align: center;
}

.vak {
    position: absolute;
    width: 18%;
    height: 8.57%;
    border: 2px solid black;
    background: white;
    font-size: clamp(10px, 1.8vw, 18px);
    text-align: center;
    padding: 4px;
    color: black;
    font-family: Arial, sans-serif;
    border-radius: 0;
}

.vak:focus {
    outline: 3px solid #b58b55;
    background: #fffdf5;
}

.boven {
    top: 7.14%;
    left: 41%;
}

.rechtsboven {
    top: 20%;
    left: 78%;
}

.rechtsonder {
    top: 71.43%;
    left: 78%;
}

.onder {
    top: 85.71%;
    left: 41%;
}

.linksonder {
    top: 71.43%;
    left: 4%;
}

.linksboven {
    top: 20%;
    left: 4%;
}

button {
    margin-top: 15px;
    padding: 12px 24px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background-color: #6B4F3A;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background-color: #4E3727;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

#melding {
    margin-top: 10px;
    font-size: 14px;
    text-align: center;
}

@media (max-width: 600px) {
    body {
        padding: 5px;
    }

    #canvas {
        padding: 5px;
    }

    .midden {
        border-width: 2px;
    }

    .vak {
        border-width: 1px;
        padding: 2px;
    }
}
</style>
</head>

<body>

<div id="canvas">
    <div id="woordweb">

        <svg viewBox="0 0 1000 700" preserveAspectRatio="none">
            <line x1="500" y1="350" x2="500" y2="110"/>
            <line x1="500" y1="350" x2="780" y2="170"/>
            <line x1="500" y1="350" x2="780" y2="530"/>
            <line x1="500" y1="350" x2="500" y2="600"/>
            <line x1="500" y1="350" x2="220" y2="530"/>
            <line x1="500" y1="350" x2="220" y2="170"/>
        </svg>

        <div class="midden">
            Zorgtechnologie
        </div>

        <input type="text" class="vak boven"
               aria-label="Bovenste begrip" placeholder="Typ hier...">

        <input type="text" class="vak rechtsboven"
               aria-label="Rechtsboven begrip" placeholder="Typ hier...">

        <input type="text" class="vak rechtsonder"
               aria-label="Rechtsonder begrip" placeholder="Typ hier...">

        <input type="text" class="vak onder"
               aria-label="Onderste begrip" placeholder="Typ hier...">

        <input type="text" class="vak linksonder"
               aria-label="Linksonder begrip" placeholder="Typ hier...">

        <input type="text" class="vak linksboven"
               aria-label="Linksboven begrip" placeholder="Typ hier...">

    </div>
</div>

<button id="downloadknop" onclick="opslaanAfbeelding()">
    Download mijn woordweb als afbeelding
</button>

<div id="melding" role="status" aria-live="polite"></div>

<script>
async function opslaanAfbeelding() {

    const knop = document.getElementById("downloadknop");
    const melding = document.getElementById("melding");

    if (typeof html2canvas === "undefined") {
        melding.textContent =
            "De downloadfunctie kon niet worden geladen.";
        return;
    }

    knop.disabled = true;
    melding.textContent = "Je woordweb wordt gemaakt...";

    try {
        const element = document.getElementById("canvas");

        const canvas = await html2canvas(element, {
            scale: 2,
            backgroundColor: "#d8c090",
            useCORS: true
        });

        const link = document.createElement("a");
        link.download = "woordweb_zorgtechnologie.png";
        link.href = canvas.toDataURL("image/png");

        document.body.appendChild(link);
        link.click();
        link.remove();

        melding.textContent =
            "Je woordweb is klaar om op te slaan!";

    } catch (error) {
        console.error(error);
        melding.textContent =
            "Er ging iets mis bij het maken van de afbeelding.";
    } finally {
        knop.disabled = false;
    }
}
</script>

</body>
</html>
